
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Neural Brain</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:radial-gradient(circle,#101a38,#030611 75%);
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}
h2{color:#6beaff;letter-spacing:2px}
canvas{
 width:min(95vw,650px);
 height:min(65vh,500px);
 touch-action:pan-y;
}
.info{text-align:center;line-height:2}
.activity{color:#55edff;font-size:25px;font-weight:bold}
button{
 background:#087fa8;color:white;border:0;
 padding:12px 25px;border-radius:25px;
 margin:12px;cursor:pointer;font-size:15px;
}
button:hover{background:#00bde9}
</style>
</head>
<body>

<h2>🧠 VIRTUAL HUMAN BRAIN</h2>
<canvas id="brain"></canvas>

<div class="info">
 <div>NEURAL NETWORK ACTIVITY</div>
 <div class="activity" id="activity">ACTIVE ⚡</div>
 <div id="count">Neurons: 120 | Connections: 260</div>
 <button onclick="boost()">Boost Brain Activity ⚡</button>
</div>

<script>
const canvas=document.getElementById("brain");
const ctx=canvas.getContext("2d");

let W,H,nodes=[],signals=[],rotation=0;
let boostLevel=1;

function resize(){
 const dpr=window.devicePixelRatio||1;
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 createBrain();
}

function createBrain(){
 nodes=[];
 signals=[];
 for(let i=0;i<120;i++){
  let angle=Math.random()*Math.PI*2;
  let r=Math.sqrt(Math.random());
  let side=Math.random()<0.5?-1:1;
  let x=Math.cos(angle)*r*105;
  let y=Math.sin(angle)*r*85;
  x+=side*35;
  nodes.push({x,y,z:(Math.random()-.5)*55});
 }
}

function project(n){
 let a=rotation;
 let x=n.x*Math.cos(a)-n.z*Math.sin(a);
 let z=n.x*Math.sin(a)+n.z*Math.cos(a);
 let scale=1+z/500;
 return {
  x:W/2+x*scale,
  y:H/2+n.y*scale,
  scale,z
 };
}

function drawBrain(){
 ctx.clearRect(0,0,W,H);

 // Brain silhouette
 ctx.save();
 ctx.translate(W/2,H/2);
 ctx.rotate(rotation*.15);
 ctx.beginPath();
 ctx.ellipse(-35,0,105,90,0,0,Math.PI*2);
 ctx.ellipse(35,0,105,90,0,0,Math.PI*2);
 ctx.fillStyle="rgba(20,100,160,.13)";
 ctx.fill();
 ctx.strokeStyle="rgba(60,220,255,.5)";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.restore();

 let projected=nodes.map(project);

 // Neural connections
 ctx.lineWidth=.8;
 for(let i=0;i<projected.length;i++){
  for(let j=i+1;j<projected.length;j++){
   let a=projected[i],b=projected[j];
   let dx=a.x-b.x,dy=a.y-b.y;
   let dist=Math.hypot(dx,dy);
   if(dist<85){
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.strokeStyle="rgba(30,190,255,"+(0.3*(1-dist/85))+")";
    ctx.stroke();
   }
  }
 }

 // Moving electrical signals
 if(Math.random()<.15*boostLevel){
  let i=Math.floor(Math.random()*nodes.length);
  let j=Math.floor(Math.random()*nodes.length);
  if(i!==j){
   let a=projected[i],b=projected[j];
   signals.push({x:a.x,y:a.y,tx:b.x,ty:b.y,t:0});
  }
 }

 signals.forEach(s=>{
  s.t+=.035*boostLevel;
  let x=s.x+(s.tx-s.x)*s.t;
  let y=s.y+(s.ty-s.y)*s.t;
  ctx.beginPath();
  ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fillStyle="#ffffff";
  ctx.shadowBlur=15;
  ctx.shadowColor="#00eaff";
  ctx.fill();
  ctx.shadowBlur=0;
 });
 signals=signals.filter(s=>s.t<1);

 // Neurons
 projected.forEach((p,i)=>{
  let pulse=3+Math.sin(Date.now()*.006+i)*1.5;
  ctx.beginPath();
  ctx.arc(p.x,p.y,pulse*p.scale,0,Math.PI*2);
  ctx.fillStyle="#5beaff";
  ctx.shadowBlur=15;
  ctx.shadowColor="#00cfff";
  ctx.fill();
  ctx.shadowBlur=0;
 });

 rotation+=.003*boostLevel;
 requestAnimationFrame(drawBrain);
}

function boost(){
 boostLevel=boostLevel===1?2:boostLevel===2?3:1;
 document.getElementById("activity").innerText=
 "ACTIVE ⚡ x"+boostLevel;
}

let dragging=false,lastX=0;
canvas.addEventListener("pointerdown",e=>{
 dragging=true;lastX=e.clientX;
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);
canvas.addEventListener("pointermove",e=>{
 if(dragging){
  rotation+=(e.clientX-lastX)*.01;
  lastX=e.clientX;
 }
});

window.addEventListener("resize",resize);
resize();
drawBrain();
</script>

</body>
</html>
