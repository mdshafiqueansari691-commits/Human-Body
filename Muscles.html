
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Human Muscular System</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle,#321c25,#05050a 85%);
 color:white;font-family:Arial;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
}
h2{color:#ff9999;text-align:center;letter-spacing:2px}
canvas{
 width:min(95vw,650px);
 height:70vh;
 max-height:650px;
 touch-action:pan-y;
}
.info{text-align:center;line-height:2}
.status{color:#ff8c9d;font-weight:bold;font-size:20px}
button{
 background:#a52d47;color:white;border:0;
 padding:12px 22px;border-radius:25px;
 margin:7px;cursor:pointer;
}
</style>
</head>
<body>

<h2>💪 VIRTUAL HUMAN MUSCULAR SYSTEM</h2>
<canvas id="muscles"></canvas>

<div class="info">
 <div class="status" id="status">MUSCLE SYSTEM ACTIVE</div>
 <div>Major Human Muscle Groups</div>
 <button onclick="toggle()">Pause / Resume</button>
 <button onclick="changeView()">Front / Back View</button>
</div>

<script>
const canvas=document.getElementById("muscles");
const ctx=canvas.getContext("2d");
let W,H,time=0,paused=false,back=false;

function resize(){
 let d=devicePixelRatio||1;
 W=canvas.clientWidth;H=canvas.clientHeight;
 canvas.width=W*d;canvas.height=H*d;
 ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);
resize();

function muscle(x,y,rx,ry,angle=0){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 let g=ctx.createLinearGradient(-rx,0,rx,0);
 g.addColorStop(0,"#781e32");
 g.addColorStop(.35,"#e45a68");
 g.addColorStop(.65,"#f18b83");
 g.addColorStop(1,"#781e32");

 ctx.beginPath();
 ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
 ctx.fillStyle=g;
 ctx.shadowColor="#ff6478";
 ctx.shadowBlur=12;
 ctx.fill();
 ctx.shadowBlur=0;

 ctx.strokeStyle="rgba(255,210,200,.4)";
 ctx.lineWidth=1;
 for(let i=-2;i<=2;i++){
  ctx.beginPath();
  ctx.moveTo(i*rx*.2,-ry*.7);
  ctx.quadraticCurveTo(i*rx*.15,0,i*rx*.2,ry*.7);
  ctx.stroke();
 }
 ctx.restore();
}

function boneJoint(x,y){
 ctx.beginPath();
 ctx.arc(x,y,6,0,Math.PI*2);
 ctx.fillStyle="#e7c4b2";
 ctx.fill();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 if(!paused)time+=.035;

 let cx=W/2,cy=H/2;
 let pulse=1+Math.sin(time*2)*.025;
 ctx.save();
 ctx.translate(cx,cy);
 ctx.scale(pulse,1);

 // Head
 ctx.beginPath();
 ctx.ellipse(0,-265,29,36,0,0,Math.PI*2);
 ctx.fillStyle="#c96c68";
 ctx.fill();

 // Neck
 muscle(0,-216,18,35);

 if(!back){
  // Chest muscles
  muscle(-30,-155,35,29,-.1);
  muscle(30,-155,35,29,.1);

  // Front shoulders
  muscle(-65,-178,19,27,-.5);
  muscle(65,-178,19,27,.5);

  // Biceps
  muscle(-82,-105,16,42,-.12);
  muscle(82,-105,16,42,.12);

  // Forearms
  muscle(-88,-35,12,43,-.1);
  muscle(88,-35,12,43,.1);

  // Abs
  for(let row=0;row<3;row++){
   for(let side of [-1,1]){
    muscle(side*12,-95+row*30,12,13);
   }
  }

  // Obliques
  muscle(-43,-65,12,48,-.35);
  muscle(43,-65,12,48,.35);

 }else{
  // Trapezius
  muscle(0,-165,50,38);
  // Back muscles
  muscle(-30,-95,25,75,-.15);
  muscle(30,-95,25,75,.15);
  // Triceps
  muscle(-80,-110,15,43,-.1);
  muscle(80,-110,15,43,.1);
  // Gluteus
  muscle(-23,30,28,30);
  muscle(23,30,28,30);
  // Hamstrings
  muscle(-32,105,17,65,-.1);
  muscle(32,105,17,65,.1);
 }

 // Arms
 for(let side of [-1,1]){
  muscle(side*105,-5,10,30,-side*.1);
  boneJoint(side*88,-20);
  muscle(side*110,25,8,20);
  for(let i=0;i<4;i++){
   muscle(side*(102+i*5),50,3,14);
  }
 }

 // Quadriceps - front view
 if(!back){
  muscle(-28,85,20,68,-.1);
  muscle(28,85,20,68,.1);
 }

 // Calves
 muscle(-31,190,14,52,.08);
 muscle(31,190,14,52,-.08);

 // Lower legs
 muscle(-30,240,9,38);
 muscle(30,240,9,38);

 // Feet
 muscle(-33,282,14,9);
 muscle(33,282,14,9);

 ctx.restore();

 // Labels
 ctx.font="bold 12px Arial";
 ctx.fillStyle="#ffb8bd";
 let labels=back?
 ["TRAPEZIUS","LATISSIMUS DORSI","TRICEPS","GLUTEUS","HAMSTRINGS","CALVES"]:
 ["PECTORALS","BICEPS","ABS","OBLIQUES","QUADRICEPS","CALVES"];

 labels.forEach((label,i)=>{
  let y=H*.15+i*25;
  ctx.fillText(label,12,y);
 });

 requestAnimationFrame(draw);
}

function toggle(){
 paused=!paused;
 document.getElementById("status").innerText=
 paused?"MUSCLES PAUSED":"MUSCLE SYSTEM ACTIVE";
}
function changeView(){
 back=!back;
 document.getElementById("status").innerText=
 back?"BACK MUSCLES":"FRONT MUSCLES";
}
draw();
</script>
</body>
</html>
